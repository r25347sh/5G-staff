<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>あみだくじ | G⁵ Games</title>
  <link rel="stylesheet" href="css/games.css">
  <style>
    .amida-stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(20,12,32,0.9), rgba(8,6,18,0.98));
      border: 1px solid rgba(255,255,255,0.1);
      min-height: 420px;
    }
    canvas#amida {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }
    .controls { max-width: 640px; margin: 0.85rem auto 0; }
    .start-picks {
      display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin: 0.6rem 0;
    }
    .start-picks button {
      min-width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid rgba(255,45,149,0.45);
      background: rgba(255,45,149,0.12); color: #fff; font-weight: 700;
      cursor: pointer; transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .start-picks button:hover { transform: scale(1.08); }
    .start-picks button.selected {
      background: linear-gradient(135deg, #ff2d95, #c026d3);
      box-shadow: 0 0 20px rgba(255,45,149,0.55);
      border-color: transparent;
    }
    .start-picks button:disabled { opacity: 0.4; cursor: not-allowed; }
    .goal-labels {
      display: flex; justify-content: space-around; max-width: 640px; margin: 0.4rem auto 0;
      font-size: 0.78rem; color: var(--muted); gap: 0.25rem;
    }
    .goal-labels span {
      flex: 1; text-align: center; padding: 0.25rem;
      border-radius: 8px; transition: background 0.3s, color 0.3s, transform 0.35s;
    }
    .goal-labels span.hit {
      background: rgba(245,200,66,0.25); color: #f5c842; font-weight: 700;
      transform: scale(1.12);
      animation: goal-pop 0.6s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes goal-pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1.12); }
    }
    .confetti {
      pointer-events: none; position: fixed; inset: 0; z-index: 50; overflow: hidden;
    }
    .particle {
      position: absolute; width: 8px; height: 8px; border-radius: 2px;
      animation: fall 1.8s ease-out forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="games-wrap">
    <header class="games-header">
      <h1>🎋 あみだくじ</h1>
      <nav>
        <a href="index.html">ゲーム一覧</a>
        <a href="../index.html">ホーム</a>
      </nav>
    </header>
    <div class="panel">
      <p class="hint">スタート番号を選ぶと、光の玉が横線を伝ってゴールまで滑ります。横線は毎回ランダム生成です。</p>
      <div class="controls">
        <label class="field">人数（縦線）
          <select id="cols">
            <option value="4">4</option>
            <option value="5" selected>5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </label>
        <div class="btn-row">
          <button type="button" class="btn-ghost btn" id="btn-regen">横線を再生成</button>
        </div>
        <p class="hint" style="margin-top:0.75rem;">スタートを選んでください</p>
        <div class="start-picks" id="starts"></div>
      </div>
      <div class="amida-stage">
        <canvas id="amida" width="640" height="480"></canvas>
      </div>
      <div class="goal-labels" id="goals"></div>
      <div class="result" id="result">スタート番号をタップすると開始します</div>
    </div>
  </div>
  <div class="confetti" id="confetti" hidden></div>
  <script src="js/common-games.js"></script>
  <script>
(function () {
  "use strict";
  var canvas = document.getElementById("amida");
  var ctx = canvas.getContext("2d");
  var cols = 5;
  var rows = 10;
  var bridges = []; // bridges[row][col] = true if horizontal between col and col+1
  var running = false;
  var goalNames = ["景品A", "景品B", "景品C", "景品D", "景品E", "景品F", "景品G", "景品H"];

  function pad() { return { t: 48, b: 48, l: 36, r: 36 }; }
  function geom() {
    var p = pad();
    var w = canvas.width - p.l - p.r;
    var h = canvas.height - p.t - p.b;
    return {
      p: p,
      x: function (c) { return p.l + (cols === 1 ? w / 2 : (c / (cols - 1)) * w); },
      y: function (r) { return p.t + (r / rows) * h; }
    };
  }

  function regenBridges() {
    bridges = [];
    for (var r = 0; r < rows; r++) {
      var row = [];
      var last = false;
      for (var c = 0; c < cols - 1; c++) {
        var put = !last && Math.random() < 0.42;
        row.push(put);
        last = put;
      }
      bridges.push(row);
    }
    // ensure each pair of adjacent has at least some bridges
    for (var c2 = 0; c2 < cols - 1; c2++) {
      var has = false;
      for (var r2 = 0; r2 < rows; r2++) if (bridges[r2][c2]) has = true;
      if (!has) bridges[1 + (c2 % (rows - 2))][c2] = true;
    }
  }

  function drawBoard(trail) {
    var g = geom();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // soft grid glow
    ctx.strokeStyle = "rgba(255,45,149,0.15)";
    ctx.lineWidth = 3;
    for (var c = 0; c < cols; c++) {
      ctx.beginPath();
      ctx.moveTo(g.x(c), g.p.t);
      ctx.lineTo(g.x(c), g.y(rows));
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(0,245,255,0.2)";
    ctx.lineWidth = 2.5;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols - 1; c++) {
        if (!bridges[r][c]) continue;
        var y = g.y(r + 0.5);
        ctx.beginPath();
        ctx.moveTo(g.x(c), y);
        ctx.lineTo(g.x(c + 1), y);
        ctx.stroke();
      }
    }

    // trail
    if (trail && trail.length > 1) {
      ctx.strokeStyle = "rgba(245,200,66,0.85)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(245,200,66,0.8)";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (var i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // start numbers
    ctx.font = "700 16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var c = 0; c < cols; c++) {
      ctx.fillStyle = "#ff2d95";
      ctx.beginPath();
      ctx.arc(g.x(c), g.p.t - 18, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillText(String(c + 1), g.x(c), g.p.t - 18);
    }
  }

  function pathForStart(startCol) {
    var g = geom();
    var col = startCol;
    var pts = [{ x: g.x(col), y: g.p.t }];
    for (var r = 0; r < rows; r++) {
      var yMid = g.y(r + 0.5);
      var yNext = g.y(r + 1);
      pts.push({ x: g.x(col), y: yMid });
      // horizontal?
      if (col < cols - 1 && bridges[r][col]) {
        pts.push({ x: g.x(col + 1), y: yMid });
        col = col + 1;
      } else if (col > 0 && bridges[r][col - 1]) {
        pts.push({ x: g.x(col - 1), y: yMid });
        col = col - 1;
      }
      pts.push({ x: g.x(col), y: yNext });
    }
    return { pts: pts, goal: col };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function animatePath(pts, onDone) {
    var trail = [];
    var seg = 0;
    var t0 = null;
    var speed = 380; // px per second feel
    function len(a, b) {
      var dx = b.x - a.x, dy = b.y - a.y;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }
    function frame(ts) {
      if (!t0) t0 = ts;
      var distBudget = ((ts - t0) / 1000) * speed;
      t0 = ts;
      while (distBudget > 0 && seg < pts.length - 1) {
        var a = pts[seg], b = pts[seg + 1];
        var L = len(a, b);
        var cur = trail.length ? trail[trail.length - 1] : a;
        var remain = len(cur, b);
        if (distBudget >= remain) {
          trail.push({ x: b.x, y: b.y });
          distBudget -= remain;
          seg++;
        } else {
          var u = distBudget / remain;
          trail.push({ x: lerp(cur.x, b.x, u), y: lerp(cur.y, b.y, u) });
          distBudget = 0;
        }
      }
      drawBoard(trail);
      // glowing head
      if (trail.length) {
        var h = trail[trail.length - 1];
        var grd = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 18);
        grd.addColorStop(0, "rgba(255,255,200,1)");
        grd.addColorStop(0.4, "rgba(245,200,66,0.9)");
        grd.addColorStop(1, "rgba(255,45,149,0)");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(h.x, h.y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (seg >= pts.length - 1) {
        onDone();
        return;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function confettiBurst() {
    var box = document.getElementById("confetti");
    box.hidden = false;
    box.innerHTML = "";
    var colors = ["#ff2d95", "#00f5ff", "#f5c842", "#fff", "#c026d3"];
    for (var i = 0; i < 48; i++) {
      var el = document.createElement("div");
      el.className = "particle";
      el.style.left = Math.random() * 100 + "vw";
      el.style.top = -10 + Math.random() * 20 + "px";
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = 1.2 + Math.random() * 1.2 + "s";
      el.style.animationDelay = Math.random() * 0.3 + "s";
      box.appendChild(el);
    }
    setTimeout(function () { box.hidden = true; box.innerHTML = ""; }, 2800);
  }

  function buildUI() {
    var starts = document.getElementById("starts");
    var goals = document.getElementById("goals");
    starts.innerHTML = "";
    goals.innerHTML = "";
    for (var i = 0; i < cols; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = String(idx + 1);
        b.addEventListener("click", function () { startFrom(idx, b); });
        starts.appendChild(b);
      })(i);
      var g = document.createElement("span");
      g.textContent = goalNames[i] || ("ゴール" + (i + 1));
      g.id = "goal-" + i;
      goals.appendChild(g);
    }
  }

  function startFrom(startCol, btn) {
    if (running) return;
    running = true;
    document.querySelectorAll(".start-picks button").forEach(function (b) {
      b.classList.remove("selected");
      b.disabled = true;
    });
    btn.classList.add("selected");
    document.querySelectorAll(".goal-labels span").forEach(function (s) {
      s.classList.remove("hit");
    });
    document.getElementById("result").textContent = "移動中…";
    document.getElementById("result").className = "result";
    var path = pathForStart(startCol);
    animatePath(path.pts, function () {
      var label = goalNames[path.goal] || ("ゴール" + (path.goal + 1));
      var el = document.getElementById("goal-" + path.goal);
      if (el) el.classList.add("hit");
      document.getElementById("result").textContent =
        "スタート " + (startCol + 1) + " → " + label + " に到着！";
      document.getElementById("result").className = "result win";
      confettiBurst();
      running = false;
      document.querySelectorAll(".start-picks button").forEach(function (b) {
        b.disabled = false;
      });
    });
  }

  function resize() {
    var stage = canvas.parentElement;
    var w = Math.min(640, stage.clientWidth || 640);
    var h = Math.round(w * 0.75);
    canvas.width = w;
    canvas.height = Math.max(360, h);
    drawBoard();
  }

  document.getElementById("cols").addEventListener("change", function () {
    cols = parseInt(this.value, 10) || 5;
    regenBridges();
    buildUI();
    resize();
  });
  document.getElementById("btn-regen").addEventListener("click", function () {
    if (running) return;
    regenBridges();
    drawBoard();
    document.getElementById("result").textContent = "横線を再生成しました。スタートを選んでください。";
    document.getElementById("result").className = "result";
    document.querySelectorAll(".goal-labels span").forEach(function (s) { s.classList.remove("hit"); });
  });

  regenBridges();
  buildUI();
  resize();
  window.addEventListener("resize", resize);
})();
  </script>
</body>
</html>
