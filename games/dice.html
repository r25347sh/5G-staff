<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>サイコロ | G⁵ Games</title>
  <link rel="stylesheet" href="css/games.css">
  <style>
    .dice-box { display:flex; gap:1rem; justify-content:center; margin:1.2rem 0; }
    .die {
      width:4.5rem; height:4.5rem; border-radius:14px;
      background:linear-gradient(145deg,#fff,#e8e0f5); color:#1a1525;
      display:flex; align-items:center; justify-content:center;
      font-size:2rem; font-weight:800;
      box-shadow:0 8px 24px rgba(0,0,0,0.35);
    }
    .die.shake { animation: shake 0.5s ease; }
    @keyframes shake {
      0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg) scale(1.05)} 75%{transform:rotate(12deg)}
    }
  </style>
</head>
<body>
<div class="games-wrap">
  <header class="games-header"><h1>🎲 サイコロ</h1>
    <nav><a href="index.html">一覧</a><a href="../index.html">ホーム</a></nav></header>
  <div class="panel">
    <p class="hint">2個のサイコロ。合計7でラッキー、ゾロ目でダブル。</p>
    <div class="dice-box">
      <div class="die" id="d1">?</div>
      <div class="die" id="d2">?</div>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn" id="roll">振る</button>
    </div>
    <div class="result" id="result">振ってみよう</div>
  </div>
</div>
<script>
document.getElementById("roll").onclick=function(){
  var a=1+Math.floor(Math.random()*6), b=1+Math.floor(Math.random()*6);
  var d1=document.getElementById("d1"), d2=document.getElementById("d2");
  d1.classList.remove("shake"); d2.classList.remove("shake");
  void d1.offsetWidth; d1.classList.add("shake"); d2.classList.add("shake");
  setTimeout(function(){
    d1.textContent=a; d2.textContent=b;
    var sum=a+b, res=document.getElementById("result");
    if(a===b){ res.textContent="ゾロ目！ "+a+" × 2  （合計 "+sum+"）"; res.className="result win"; }
    else if(sum===7){ res.textContent="ラッキー7！ 合計 "+sum; res.className="result win"; }
    else { res.textContent="合計 "+sum; res.className="result"; }
  }, 280);
};
</script>
</body></html>
