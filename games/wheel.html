<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>プライズホイール | G⁵ Games</title>
  <link rel="stylesheet" href="css/games.css">
  <style>
    .wheel-wrap { position:relative; width:min(320px,90vw); margin:1rem auto; }
    canvas { width:100%; height:auto; display:block; }
    .pointer {
      position:absolute; top:-8px; left:50%; transform:translateX(-50%);
      width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent;
      border-top:22px solid #f5c842; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5)); z-index:2;
    }
  </style>
</head>
<body>
<div class="games-wrap">
  <header class="games-header"><h1>🎡 プライズホイール</h1>
    <nav><a href="index.html">一覧</a><a href="../index.html">ホーム</a></nav></header>
  <div class="panel" style="text-align:center">
    <p class="hint">回して止まったマスが当たり。スタッフ誘導・景品振分用。</p>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="w" width="320" height="320"></canvas>
    </div>
    <div class="btn-row" style="justify-content:center"><button class="btn" id="spin">回す</button></div>
    <div class="result" id="result">準備OK</div>
  </div>
</div>
<script>
(function(){
  var labels=["景品A","景品B","もう一回","景品C","はずれ","景品D","景品E","特別賞"];
  var colors=["#ff2d95","#c026d3","#00f5ff","#3b82f6","#64748b","#f5c842","#22c55e","#ef4444"];
  var cv=document.getElementById("w"), ctx=cv.getContext("2d");
  var rot=0, spinning=false;
  function draw(){
    var n=labels.length, r=150, cx=160, cy=160;
    ctx.clearRect(0,0,320,320);
    for(var i=0;i<n;i++){
      var a0=rot+i*(Math.PI*2/n), a1=a0+Math.PI*2/n;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
      ctx.fillStyle=colors[i]; ctx.fill();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a0+Math.PI/n);
      ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="right";
      ctx.fillText(labels[i], r-12, 4); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx,cy,28,0,Math.PI*2); ctx.fillStyle="#1a0f2e"; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.lineWidth=3; ctx.stroke();
  }
  function spin(){
    if(spinning) return; spinning=true;
    document.getElementById("spin").disabled=true;
    var extra=Math.PI*2*(4+Math.random()*3)+Math.random()*Math.PI*2;
    var start=rot, t0=null, dur=4200;
    function frame(ts){
      if(!t0) t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      var e=1-Math.pow(1-p,3);
      rot=start+extra*e; draw();
      if(p<1) requestAnimationFrame(frame);
      else {
        spinning=false; document.getElementById("spin").disabled=false;
        // pointer at top = angle -PI/2 in canvas coords; segment under pointer
        var ang=(( -rot - Math.PI/2 )%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
        var idx=Math.floor(ang/(Math.PI*2/labels.length))%labels.length;
        var res=document.getElementById("result");
        res.textContent="結果: "+labels[idx];
        res.className=labels[idx].indexOf("はずれ")>=0?"result lose":"result win";
      }
    }
    requestAnimationFrame(frame);
  }
  draw(); document.getElementById("spin").onclick=spin;
})();
</script>
</body></html>
