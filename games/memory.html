<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>神経衰弱 | G⁵ Games</title>
  <link rel="stylesheet" href="css/games.css">
  <style>
    :root {
      --cell: min(18vw, 72px);
      --gap: 0.4rem;
      --label: 1.6rem;
    }
    @media (min-width: 480px) {
      :root { --cell: 76px; --gap: 0.5rem; --label: 1.75rem; }
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }
    .hud-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0.55rem 0.65rem;
      text-align: center;
    }
    .hud-item .lbl {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: rgba(245,240,255,0.55);
      text-transform: uppercase;
    }
    .hud-item .val {
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 0.15rem;
      background: linear-gradient(105deg, #fff, #ff2d95, #00f5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hud-item.combo .val { color: #f5c842; background: none; -webkit-text-fill-color: #f5c842; }

    .diff-row {
      display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center;
      margin-bottom: 0.85rem;
    }
    .diff-row button {
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05); color: #f5f0ff;
      padding: 0.4rem 0.85rem; font: inherit; font-size: 0.82rem; font-weight: 650;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .diff-row button:hover { transform: translateY(-1px); }
    .diff-row button.active {
      background: linear-gradient(105deg, #ff2d95, #c026d3);
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255,45,149,0.35);
    }

    /* numbered board */
    .board-shell {
      display: grid;
      justify-content: center;
      margin: 0.5rem auto 0.75rem;
      width: fit-content;
      max-width: 100%;
    }
    .board-grid {
      display: grid;
      gap: var(--gap);
      /* label col + N card cols */
    }
    .corner {
      width: var(--label); height: var(--label);
    }
    .col-label, .row-label {
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
      color: rgba(0,245,255,0.85);
      text-shadow: 0 0 12px rgba(0,245,255,0.35);
      user-select: none;
    }
    .col-label {
      width: var(--cell); height: var(--label);
    }
    .row-label {
      width: var(--label); height: var(--cell);
    }

    .tile {
      width: var(--cell); height: var(--cell);
      perspective: 600px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tile-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 14px;
    }
    .tile.open .tile-inner,
    .tile.done .tile-inner {
      transform: rotateY(180deg);
    }
    .face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }
    .face.back {
      background:
        radial-gradient(circle at 30% 25%, rgba(255,45,149,0.45), transparent 55%),
        radial-gradient(circle at 75% 70%, rgba(0,245,255,0.3), transparent 50%),
        linear-gradient(145deg, #1a1030, #0c0818);
      overflow: hidden;
    }
    .face.back::before {
      content: "G⁵";
      font-size: calc(var(--cell) * 0.28);
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #ff2d95, #00f5ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0.9;
    }
    .face.back::after {
      content: "";
      position: absolute; inset: 6px;
      border-radius: 10px;
      border: 1px dashed rgba(255,255,255,0.12);
      pointer-events: none;
    }
    .face.front {
      background: linear-gradient(160deg, #f8f4ff, #e8e0f8);
      color: #1a1525;
      transform: rotateY(180deg);
      font-size: calc(var(--cell) * 0.48);
      border-color: rgba(255,45,149,0.25);
    }
    .tile.done .face.front {
      background: linear-gradient(160deg, #fff8d6, #ffe08a);
      box-shadow: 0 0 0 2px rgba(245,200,66,0.55), 0 8px 22px rgba(245,200,66,0.25);
      animation: match-pulse 0.55s ease;
    }
    .tile.mismatch .tile-inner {
      animation: shake-x 0.45s ease;
    }
    .tile:not(.open):not(.done):hover .tile-inner {
      transform: translateY(-2px) scale(1.03);
    }
    .tile:not(.open):not(.done):active .tile-inner {
      transform: scale(0.97);
    }
    @keyframes match-pulse {
      0% { transform: rotateY(180deg) scale(0.92); }
      55% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    @keyframes shake-x {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }

    .burst {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      animation: spark-fly 0.85s ease-out forwards;
    }
    @keyframes spark-fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .clear-banner {
      display: none;
      margin-top: 0.75rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      text-align: center;
      background: linear-gradient(105deg, rgba(255,45,149,0.2), rgba(245,200,66,0.18));
      border: 1px solid rgba(245,200,66,0.4);
      font-weight: 800;
      font-size: 1.05rem;
      animation: banner-in 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .clear-banner.show { display: block; }
    @keyframes banner-in {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }

    .best {
      text-align: center;
      font-size: 0.8rem;
      color: rgba(245,240,255,0.55);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="games-wrap">
    <header class="games-header">
      <h1>🧠 神経衰弱</h1>
      <nav>
        <a href="index.html">ゲーム一覧</a>
        <a href="../index.html">ホーム</a>
      </nav>
    </header>

    <div class="panel">
      <p class="hint">同じ絵柄のカードを2枚そろえて消します。行・列の番号を目印に覚えてね。</p>

      <div class="diff-row" id="diff">
        <button type="button" data-d="easy" class="active">かんたん 4×3</button>
        <button type="button" data-d="normal">ふつう 4×4</button>
        <button type="button" data-d="hard">むずかしい 5×4</button>
        <button type="button" data-d="expert">激むず 6×4</button>
      </div>

      <div class="hud">
        <div class="hud-item">
          <span class="lbl">手数</span>
          <div class="val" id="moves">0</div>
        </div>
        <div class="hud-item">
          <span class="lbl">タイム</span>
          <div class="val" id="time">0:00</div>
        </div>
        <div class="hud-item combo">
          <span class="lbl">コンボ</span>
          <div class="val" id="combo">0</div>
        </div>
      </div>

      <div class="board-shell">
        <div class="board-grid" id="board" aria-label="神経衰弱ボード"></div>
      </div>

      <div class="btn-row" style="justify-content:center">
        <button type="button" class="btn" id="reset">もう一回</button>
        <button type="button" class="btn btn-ghost" id="peek" title="開始前だけ全公開（3秒）">チラ見せ</button>
      </div>

      <div class="result" id="result">カードをタップして開始</div>
      <div class="clear-banner" id="banner"></div>
      <p class="best" id="best"></p>
    </div>
  </div>
  <div class="burst" id="burst" hidden></div>

  <script>
(function () {
  "use strict";

  var ICONS = [
    "🍒", "🍋", "🔔", "⭐", "💎", "🍉", "🍇", "🍀",
    "🎯", "🔥", "🌙", "🎪"
  ];

  var DIFFS = {
    easy:   { cols: 4, rows: 3, pairs: 6 },
    normal: { cols: 4, rows: 4, pairs: 8 },
    hard:   { cols: 5, rows: 4, pairs: 10 },
    expert: { cols: 6, rows: 4, pairs: 12 }
  };

  var state = {
    diff: "easy",
    cols: 4,
    rows: 3,
    cells: [],
    values: [],
    first: null,
    lock: false,
    moves: 0,
    matched: 0,
    combo: 0,
    maxCombo: 0,
    started: false,
    t0: 0,
    timer: null,
    peeking: false
  };

  var boardEl = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var timeEl = document.getElementById("time");
  var comboEl = document.getElementById("combo");
  var resultEl = document.getElementById("result");
  var bannerEl = document.getElementById("banner");
  var bestEl = document.getElementById("best");

  function storageKey() {
    return "g5_memory_best_" + state.diff;
  }

  function loadBest() {
    try {
      var raw = localStorage.getItem(storageKey());
      if (!raw) { bestEl.textContent = ""; return; }
      var b = JSON.parse(raw);
      bestEl.textContent = "ベスト: " + b.moves + "手 / " + formatTime(b.ms) +
        (b.maxCombo ? "（最大コンボ " + b.maxCombo + "）" : "");
    } catch (e) {
      bestEl.textContent = "";
    }
  }

  function saveBest(ms) {
    try {
      var prev = null;
      try { prev = JSON.parse(localStorage.getItem(storageKey()) || "null"); } catch (e) {}
      var next = { moves: state.moves, ms: ms, maxCombo: state.maxCombo };
      if (!prev || next.moves < prev.moves || (next.moves === prev.moves && next.ms < prev.ms)) {
        localStorage.setItem(storageKey(), JSON.stringify(next));
      }
      loadBest();
    } catch (e) {}
  }

  function formatTime(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function tick() {
    if (!state.started || !state.t0) return;
    timeEl.textContent = formatTime(Date.now() - state.t0);
  }

  function startTimer() {
    if (state.started) return;
    state.started = true;
    state.t0 = Date.now();
    state.timer = setInterval(tick, 250);
  }

  function stopTimer() {
    if (state.timer) clearInterval(state.timer);
    state.timer = null;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sparkAt(el) {
    var box = document.getElementById("burst");
    box.hidden = false;
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var colors = ["#ff2d95", "#00f5ff", "#f5c842", "#fff", "#c026d3"];
    for (var i = 0; i < 14; i++) {
      var sp = document.createElement("div");
      sp.className = "spark";
      var ang = (Math.PI * 2 * i) / 14 + Math.random() * 0.3;
      var dist = 40 + Math.random() * 50;
      sp.style.left = cx + "px";
      sp.style.top = cy + "px";
      sp.style.background = colors[i % colors.length];
      sp.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      sp.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      box.appendChild(sp);
      (function (node) {
        setTimeout(function () { node.remove(); }, 900);
      })(sp);
    }
    setTimeout(function () {
      if (!box.children.length) box.hidden = true;
    }, 950);
  }

  function build() {
    stopTimer();
    var d = DIFFS[state.diff];
    state.cols = d.cols;
    state.rows = d.rows;
    state.first = null;
    state.lock = false;
    state.moves = 0;
    state.matched = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.started = false;
    state.t0 = 0;
    state.peeking = false;

    movesEl.textContent = "0";
    timeEl.textContent = "0:00";
    comboEl.textContent = "0";
    resultEl.textContent = "カードをタップして開始";
    resultEl.className = "result";
    bannerEl.className = "clear-banner";
    bannerEl.textContent = "";

    var pairIcons = ICONS.slice(0, d.pairs);
    var deck = shuffle(pairIcons.concat(pairIcons));
    state.values = deck;

    var cols = state.cols;
    var rows = state.rows;
    boardEl.style.gridTemplateColumns = varLabelCols(cols);
    boardEl.innerHTML = "";

    // corner
    var corner = document.createElement("div");
    corner.className = "corner";
    boardEl.appendChild(corner);

    // column labels 1..cols
    for (var c = 0; c < cols; c++) {
      var cl = document.createElement("div");
      cl.className = "col-label";
      cl.textContent = String(c + 1);
      cl.title = "列 " + (c + 1);
      boardEl.appendChild(cl);
    }

    state.cells = [];
    for (var r = 0; r < rows; r++) {
      var rl = document.createElement("div");
      rl.className = "row-label";
      rl.textContent = String(r + 1);
      rl.title = "行 " + (r + 1);
      boardEl.appendChild(rl);

      for (var c2 = 0; c2 < cols; c2++) {
        var idx = r * cols + c2;
        var tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.idx = String(idx);
        tile.dataset.row = String(r + 1);
        tile.dataset.col = String(c2 + 1);
        tile.setAttribute("role", "button");
        tile.setAttribute("aria-label", "行" + (r + 1) + " 列" + (c2 + 1));

        var inner = document.createElement("div");
        inner.className = "tile-inner";
        var back = document.createElement("div");
        back.className = "face back";
        var front = document.createElement("div");
        front.className = "face front";
        front.textContent = deck[idx];

        inner.appendChild(back);
        inner.appendChild(front);
        tile.appendChild(inner);

        (function (i) {
          tile.addEventListener("click", function () { onFlip(i); });
        })(idx);

        boardEl.appendChild(tile);
        state.cells.push(tile);
      }
    }

    loadBest();
  }

  function varLabelCols(cols) {
    var parts = ["var(--label)"];
    for (var i = 0; i < cols; i++) parts.push("var(--cell)");
    return parts.join(" ");
  }

  function onFlip(idx) {
    if (state.lock || state.peeking) return;
    var tile = state.cells[idx];
    if (!tile || tile.classList.contains("open") || tile.classList.contains("done")) return;

    startTimer();
    tile.classList.add("open");

    if (state.first === null) {
      state.first = idx;
      var r = tile.dataset.row, c = tile.dataset.col;
      resultEl.textContent = "1枚目: 行" + r + "・列" + c;
      resultEl.className = "result";
      return;
    }

    state.moves++;
    movesEl.textContent = String(state.moves);
    state.lock = true;

    var a = state.cells[state.first];
    var b = tile;
    var same = state.values[state.first] === state.values[idx];

    if (same) {
      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      comboEl.textContent = String(state.combo);
      setTimeout(function () {
        a.classList.add("done");
        b.classList.add("done");
        sparkAt(a);
        sparkAt(b);
        state.matched++;
        state.first = null;
        state.lock = false;
        resultEl.textContent = "そろった！ コンボ ×" + state.combo;
        resultEl.className = "result win";
        if (state.matched >= DIFFS[state.diff].pairs) {
          finish();
        }
      }, 280);
    } else {
      state.combo = 0;
      comboEl.textContent = "0";
      a.classList.add("mismatch");
      b.classList.add("mismatch");
      resultEl.textContent = "不一致… 行" + a.dataset.row + "列" + a.dataset.col +
        " ≠ 行" + b.dataset.row + "列" + b.dataset.col;
      resultEl.className = "result lose";
      setTimeout(function () {
        a.classList.remove("open", "mismatch");
        b.classList.remove("open", "mismatch");
        state.first = null;
        state.lock = false;
      }, 700);
    }
  }

  function finish() {
    stopTimer();
    var ms = Date.now() - state.t0;
    tick();
    var score = Math.max(0, 10000 - state.moves * 120 - Math.floor(ms / 50) + state.maxCombo * 200);
    bannerEl.textContent = "クリア！ " + state.moves + "手 / " + formatTime(ms) +
      " / 最大コンボ " + state.maxCombo + " / スコア " + score;
    bannerEl.className = "clear-banner show";
    resultEl.textContent = "おめでとう 🎉";
    resultEl.className = "result win";
    saveBest(ms);

    // reveal celebration: pulse all done tiles already gold
    state.cells.forEach(function (t, i) {
      setTimeout(function () { sparkAt(t); }, i * 40);
    });
  }

  function peek() {
    if (state.started || state.peeking) return;
    state.peeking = true;
    state.cells.forEach(function (t) { t.classList.add("open"); });
    resultEl.textContent = "3秒間チラ見せ中…";
    resultEl.className = "result";
    setTimeout(function () {
      state.cells.forEach(function (t) {
        if (!t.classList.contains("done")) t.classList.remove("open");
      });
      state.peeking = false;
      resultEl.textContent = "覚えた？ スタート！";
    }, 3000);
  }

  document.getElementById("reset").addEventListener("click", build);
  document.getElementById("peek").addEventListener("click", peek);

  document.getElementById("diff").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-d]");
    if (!btn) return;
    state.diff = btn.getAttribute("data-d");
    document.querySelectorAll("#diff button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    build();
  });

  build();
})();
  </script>
</body>
</html>
