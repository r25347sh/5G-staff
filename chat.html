<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>チャット | G⁵ Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <script src="js/load.js"></script>
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <a href="#main-content" class="skip-link">本文へスキップ</a>
  <button id="notif-bell" class="notif-bell" aria-label="通知"><span class="bell-icon">🔔</span><span id="notif-badge" class="notif-badge" hidden>0</span></button>
  <div id="notif-panel" class="notif-panel" hidden><div class="notif-panel-header">通知</div><ul id="notif-list"></ul></div>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <header class="page-header">
    <h1>チャット</h1>
    <p>全体チャット ／ 生徒同士の1対1（DM）</p>
    <nav class="page-nav" aria-label="ページナビ">
      <a href="index.html">ホーム</a>
      <a href="shift.html">シフト</a>
      <a href="threads.html">スレッド</a>
      <a href="login.html">ログイン</a>
    </nav>
  </header>
  <div id="banner-slot" class="banner-slot"></div>
  <main class="main_section chat-layout" id="main-content">
    <div class="chat-toolbar">
      <span id="chat-session" class="session-label"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-chat-refresh">更新</button>
    </div>
    <div id="chat-mode-bar" class="chat-mode-bar" hidden>
      <button type="button" class="chat-mode-btn active" data-mode="global">全体</button>
      <button type="button" class="chat-mode-btn" data-mode="dm">1対1（DM）</button>
      <div id="chat-dm-wrap" hidden style="flex:1;min-width:12rem;">
        <label class="sr-only" for="chat-dm-peer">相手</label>
        <select id="chat-dm-peer" style="width:100%;"></select>
      </div>
    </div>
    <div id="chat-need-login" class="admin-card" hidden>
      <p>チャットの送信にはログインが必要です。生徒同士の会話も可能です。</p>
      <a class="btn btn-primary" href="login.html?next=chat.html">ログインする</a>
    </div>
    <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
    <form id="chat-form" class="chat-form" hidden>
      <label for="chat-input" class="sr-only">メッセージ</label>
      <input type="text" id="chat-input" maxlength="500" placeholder="メッセージを入力…（生徒同士OK）" autocomplete="off">
      <button type="submit" class="btn btn-primary">送信</button>
    </form>
    <p id="chat-msg" class="msg" role="status"></p>
  </main>
  <footer class="site-footer"><p><strong>G⁵ Portal</strong></p></footer>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/notif.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
