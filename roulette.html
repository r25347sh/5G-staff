<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>ルーレット | G⁵ Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <script src="js/load.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .roulette-page { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; position: relative; z-index: 1; }
    .roulette-header { text-align: center; margin-bottom: 1.5rem; }
    .roulette-header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      background: linear-gradient(105deg, #fff 10%, var(--pink) 55%, var(--gold) 95%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .roulette-header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.4rem; }
    .wheel-stage {
      position: relative;
      width: min(92vw, 420px);
      height: min(92vw, 420px);
      margin: 0 auto 1.5rem;
    }
    .wheel-outer {
      position: absolute; inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, transparent 58%, rgba(255,215,0,0.15) 59%, rgba(255,215,0,0.45) 62%, #1a1228 68%, #0a0712 100%);
      box-shadow:
        0 0 0 3px rgba(255, 215, 0, 0.55),
        0 0 28px rgba(255, 45, 149, 0.25),
        inset 0 0 40px rgba(0,0,0,0.5);
    }
    #wheel-canvas {
      position: absolute;
      left: 50%; top: 50%;
      width: 86%; height: 86%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    .wheel-pointer {
      position: absolute;
      top: -6px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 28px solid var(--gold);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      z-index: 5;
    }
    .wheel-hub {
      position: absolute;
      left: 50%; top: 50%;
      width: 18%; height: 18%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe9a0, var(--gold) 45%, #b8860b);
      box-shadow: 0 0 12px rgba(255,215,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
      z-index: 4;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: #3a2a00;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .result-panel {
      text-align: center;
      margin: 1rem auto 1.5rem;
      padding: 1rem 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 360px;
    }
    .result-label { color: var(--text-muted); font-size: 0.8rem; letter-spacing: 0.08em; }
    .result-value {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 700;
      margin: 0.2rem 0;
      min-height: 2.6rem;
    }
    .result-value.is-red { color: #ff4d6d; text-shadow: 0 0 16px rgba(255,45,149,0.45); }
    .result-value.is-black { color: #e8e0f5; text-shadow: 0 0 12px rgba(155,93,229,0.4); }
    .result-value.is-green { color: #3dff9a; text-shadow: 0 0 16px rgba(61,255,154,0.45); }
    .result-meta { font-size: 0.9rem; color: var(--text-muted); }
    .spin-controls { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem; }
    .btn-spin { min-width: 160px; font-size: 1.05rem; padding: 0.95rem 2rem; }
    .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .bet-board {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .bet-board h2 { font-size: 1.1rem; margin-bottom: 0.75rem; text-align: center; }
    .bet-row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 0.75rem; }
    .bet-chip {
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .bet-chip:hover { border-color: var(--pink); transform: translateY(-1px); }
    .bet-chip.active { border-color: var(--gold); background: rgba(255,215,0,0.12); color: var(--gold); }
    .bet-chip.bet-red { border-color: rgba(255,77,109,0.45); }
    .bet-chip.bet-red.active { background: rgba(255,77,109,0.2); color: #ff8fa3; border-color: #ff4d6d; }
    .bet-chip.bet-black { border-color: rgba(200,180,255,0.35); }
    .bet-chip.bet-black.active { background: rgba(155,93,229,0.2); color: #d4bfff; }
    .bet-chip.bet-green { border-color: rgba(61,255,154,0.4); }
    .bet-chip.bet-green.active { background: rgba(61,255,154,0.15); color: #3dff9a; }
    .balance-row {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.5rem;
      font-size: 0.95rem; margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
    }
    .balance-row strong { color: var(--gold); font-family: var(--font-display); }
    .history-strip {
      display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center;
      min-height: 2rem; margin-top: 0.5rem;
    }
    .hist-ball {
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hist-ball.h-red { background: #c41e3a; color: #fff; }
    .hist-ball.h-black { background: #1a1a1a; color: #eee; }
    .hist-ball.h-green { background: #0d7a3f; color: #fff; }
    .page-nav-bar {
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      justify-content: center; margin-bottom: 1rem; font-size: 0.85rem;
    }
    .page-nav-bar a { color: var(--cyan); opacity: 0.9; }
    .payout-hint { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <button id="notif-bell" class="notif-bell" aria-label="通知"><span class="bell-icon">🔔</span><span id="notif-badge" class="notif-badge" hidden>0</span></button>
  <div id="notif-panel" class="notif-panel" hidden><div class="notif-panel-header">通知</div><ul id="notif-list"></ul></div>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>

  <main class="roulette-page">
    <nav class="page-nav-bar" aria-label="ページナビ">
      <a href="index.html">ホーム</a>
      <a href="shift.html">シフト</a>
      <a href="notifications.html">通知</a>
      <a href="manual.html">マニュアル</a>
    </nav>

    <header class="roulette-header">
      <h1>ROULETTE</h1>
      <p>ヨーロピアン・ルーレット（単一 0）· 本格配置 · G⁵ デザイン</p>
    </header>

    <div class="wheel-stage" id="wheel-stage">
      <div class="wheel-outer"></div>
      <canvas id="wheel-canvas" width="600" height="600" aria-label="ルーレットホイール"></canvas>
      <div class="wheel-hub">G⁵</div>
      <div class="wheel-pointer" aria-hidden="true"></div>
    </div>

    <div class="result-panel">
      <div class="result-label">RESULT</div>
      <div class="result-value" id="result-value">—</div>
      <div class="result-meta" id="result-meta">スピンして結果を表示</div>
    </div>

    <div class="spin-controls">
      <button type="button" class="btn btn-primary btn-spin" id="btn-spin">スピン</button>
      <button type="button" class="btn btn-ghost" id="btn-clear-bet">ベット解除</button>
    </div>

    <section class="bet-board" aria-label="ベット">
      <h2>ベット</h2>
      <div class="balance-row">
        <span>残高 <strong id="balance">1000</strong></span>
        <span>ベット額
          <select id="bet-amount" aria-label="ベット額">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </span>
      </div>
      <div class="bet-row">
        <button type="button" class="bet-chip bet-red" data-bet="red">赤 ×2</button>
        <button type="button" class="bet-chip bet-black" data-bet="black">黒 ×2</button>
        <button type="button" class="bet-chip bet-green" data-bet="green">0 ×36</button>
      </div>
      <div class="bet-row">
        <button type="button" class="bet-chip" data-bet="even">偶数 ×2</button>
        <button type="button" class="bet-chip" data-bet="odd">奇数 ×2</button>
        <button type="button" class="bet-chip" data-bet="low">1–18 ×2</button>
        <button type="button" class="bet-chip" data-bet="high">19–36 ×2</button>
      </div>
      <p class="payout-hint">選択中: <span id="bet-label">なし</span> · ヨーロピアン（0 は緑・赤黒は引き分けなし）</p>
      <div class="history-strip" id="history" aria-label="履歴"></div>
    </section>
  </main>

  <footer class="site-footer"><p><strong>G⁵ Portal</strong> · European Roulette</p></footer>

  <script>
(function () {
  "use strict";

  var ORDER = [
    0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23,
    10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
  ];
  var RED = {
    1:1,3:1,5:1,7:1,9:1,12:1,14:1,16:1,18:1,19:1,21:1,23:1,25:1,27:1,30:1,32:1,34:1,36:1
  };
  var POCKET = 360 / 37;

  function colorOf(n) {
    if (n === 0) return "green";
    return RED[n] ? "red" : "black";
  }
  function colorLabel(c) {
    return c === "red" ? "赤" : c === "black" ? "黒" : "緑 (0)";
  }

  (function assertWheel() {
    if (ORDER.length !== 37) throw new Error("ORDER length");
    var seen = {};
    for (var i = 0; i < 37; i++) {
      if (ORDER[i] < 0 || ORDER[i] > 36 || seen[ORDER[i]]) throw new Error("ORDER invalid");
      seen[ORDER[i]] = 1;
    }
    var redCount = 0;
    for (var k in RED) redCount++;
    if (redCount !== 18) throw new Error("RED count");
  })();

  var canvas = document.getElementById("wheel-canvas");
  var ctx = canvas.getContext("2d");
  var rotation = 0;
  var spinning = false;
  var balance = 1000;
  var currentBet = null;
  var history = [];

  function drawWheel(rotDeg) {
    var w = canvas.width;
    var cx = w / 2;
    var cy = w / 2;
    var r = w / 2 - 4;
    ctx.clearRect(0, 0, w, w);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = "#0d0a14";
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((rotDeg * Math.PI) / 180);

    for (var i = 0; i < 37; i++) {
      var start = ((i * POCKET) - POCKET / 2 - 90) * Math.PI / 180;
      var end = (((i + 1) * POCKET) - POCKET / 2 - 90) * Math.PI / 180;
      var n = ORDER[i];
      var col = colorOf(n);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r - 2, start, end);
      ctx.closePath();
      if (col === "red") ctx.fillStyle = "#c41e3a";
      else if (col === "black") ctx.fillStyle = "#121018";
      else ctx.fillStyle = "#0a6b3c";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,215,0,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();

      var mid = (start + end) / 2;
      var tx = Math.cos(mid) * (r * 0.72);
      var ty = Math.sin(mid) * (r * 0.72);
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(mid + Math.PI / 2);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px 'Noto Sans JP', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(n), 0, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,215,0,0.5)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(10,7,18,0.85)";
    ctx.fill();
    ctx.restore();
  }

  function indexAtRotation(R) {
    var a = ((R % 360) + 360) % 360;
    var idx = Math.round(a / POCKET) % 37;
    if (idx < 0) idx += 37;
    return idx;
  }

  function numberAtRotation(R) {
    return ORDER[indexAtRotation(R)];
  }

  function targetRotationForIndex(winIndex, extraSpins) {
    return extraSpins * 360 + winIndex * POCKET;
  }

  function setResultUI(n) {
    var el = document.getElementById("result-value");
    var meta = document.getElementById("result-meta");
    var c = colorOf(n);
    el.textContent = String(n);
    el.className = "result-value is-" + c;
    meta.textContent = colorLabel(c) + (n === 0 ? "" : (n % 2 === 0 ? " · 偶数" : " · 奇数"));
  }

  function pushHistory(n) {
    history.unshift(n);
    if (history.length > 16) history.pop();
    var strip = document.getElementById("history");
    strip.innerHTML = history.map(function (x) {
      var c = colorOf(x);
      return '<span class="hist-ball h-' + c + '">' + x + "</span>";
    }).join("");
  }

  function updateBalance() {
    document.getElementById("balance").textContent = String(balance);
  }

  function settleBet(n) {
    if (!currentBet) return;
    var type = currentBet.type;
    var amt = currentBet.amount;
    var win = 0;
    var c = colorOf(n);
    if (type === "red" && c === "red") win = amt * 2;
    else if (type === "black" && c === "black") win = amt * 2;
    else if (type === "green" && n === 0) win = amt * 36;
    else if (type === "even" && n !== 0 && n % 2 === 0) win = amt * 2;
    else if (type === "odd" && n !== 0 && n % 2 === 1) win = amt * 2;
    else if (type === "low" && n >= 1 && n <= 18) win = amt * 2;
    else if (type === "high" && n >= 19 && n <= 36) win = amt * 2;

    if (win > 0) {
      balance += win;
      document.getElementById("result-meta").textContent += " · 的中 +" + win;
    } else {
      document.getElementById("result-meta").textContent += " · はずれ −" + amt;
    }
    updateBalance();
  }

  function spin() {
    if (spinning) return;
    var amt = parseInt(document.getElementById("bet-amount").value, 10) || 0;
    if (currentBet) {
      if (balance < amt) {
        alert("残高不足です");
        return;
      }
      currentBet.amount = amt;
      balance -= amt;
      updateBalance();
    }

    spinning = true;
    document.getElementById("btn-spin").disabled = true;

    /* 1) Decide winning number FIRST */
    var winIndex = Math.floor(Math.random() * 37);
    var winNumber = ORDER[winIndex];

    /* 2) Animate wheel to that pocket */
    var extra = 4 + Math.floor(Math.random() * 3);
    var startRot = rotation;
    var currentMod = ((startRot % 360) + 360) % 360;
    var desiredMod = ((winIndex * POCKET) % 360 + 360) % 360;
    var delta = desiredMod - currentMod;
    if (delta < 0) delta += 360;
    var target = startRot + delta + extra * 360;

    var duration = 5200 + Math.random() * 1200;
    var t0 = performance.now();

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function frame(now) {
      var t = Math.min(1, (now - t0) / duration);
      var e = easeOutCubic(t);
      rotation = startRot + (target - startRot) * e;
      drawWheel(rotation);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = target;
        drawWheel(rotation);
        var landed = numberAtRotation(rotation);
        if (landed !== winNumber) {
          console.error("mapping mismatch", landed, winNumber, rotation);
          landed = winNumber;
        }
        setResultUI(landed);
        pushHistory(landed);
        settleBet(landed);
        spinning = false;
        document.getElementById("btn-spin").disabled = false;
      }
    }
    requestAnimationFrame(frame);
  }

  document.querySelectorAll(".bet-chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".bet-chip").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      currentBet = { type: btn.dataset.bet, amount: 0 };
      document.getElementById("bet-label").textContent = btn.textContent.trim();
    });
  });
  document.getElementById("btn-clear-bet").addEventListener("click", function () {
    currentBet = null;
    document.querySelectorAll(".bet-chip").forEach(function (b) {
      b.classList.remove("active");
    });
    document.getElementById("bet-label").textContent = "なし";
  });
  document.getElementById("btn-spin").addEventListener("click", spin);

  drawWheel(0);
  updateBalance();
})();
  </script>
</body>
</html>
