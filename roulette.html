<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>ルーレット | G⁵ Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <script src="js/load.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/roulette.css">
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>

  <main class="roulette-page">
    <nav class="page-nav-bar" aria-label="ページナビ">
      <a href="index.html">ホーム</a>
      <a href="shift.html">シフト</a>
      <a href="manual.html">マニュアル</a>
      <a href="poker.html">ポーカー</a>
    </nav>

    <header class="roulette-header">
      <h1>ROULETTE</h1>
      <p>ヨーロピアン（0 のみ）· 結果表示用 · 賭けは物理チップで</p>
    </header>

    <div class="wheel-stage" id="wheel-stage">
      <div class="wheel-outer"></div>
      <canvas id="wheel-canvas" width="600" height="600" aria-label="ルーレットホイール"></canvas>
      <div class="wheel-hub">G⁵</div>
      <div class="wheel-pointer" aria-hidden="true"></div>
    </div>

    <div class="result-panel">
      <div class="result-label">RESULT</div>
      <div class="result-value" id="result-value">—</div>
      <div class="result-meta" id="result-meta">スピンして結果を表示</div>
    </div>

    <div class="spin-controls">
      <button type="button" class="btn btn-primary btn-spin" id="btn-spin">スピン</button>
    </div>

    <section class="history-panel" aria-label="出目履歴">
      <h2>HISTORY</h2>
      <div class="history-strip" id="history"></div>
    </section>

    <p class="hint-line">
      配当・賭け方は <a href="manual.html">マニュアル</a> または卓上ルール表を参照 · Space でスピン
    </p>
  </main>

  <div id="result-modal" class="result-modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="modal-num">
    <div class="result-modal">
      <div class="result-modal-label">RESULT</div>
      <div class="result-modal-num" id="modal-num">—</div>
      <div class="result-modal-meta" id="modal-meta"></div>
      <button type="button" class="btn btn-primary" id="modal-close">OK</button>
    </div>
  </div>

  <footer class="site-footer"><p><strong>G⁵ Portal</strong> · European Roulette</p></footer>

  <script src="js/common.js"></script>
  <script src="js/roulette.js"></script>
</body>
</html>
